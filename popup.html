<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="brand">
          <img class="avatar" src="icons/assistant-idle.svg" alt="" />
          <h1>小译</h1>
        </div>
        <div class="header-actions">
          <button id="assistantModeToggle" class="mode-toggle assistant-mode-toggle" type="button">随身译</button>
          <button id="selectionModeToggle" class="mode-toggle selection-mode-toggle" type="button">随手划</button>
          <div id="selectionLanguageControl" class="selection-language-control">
            <select id="selectionTargetLanguage" aria-label="随手划目标语言"></select>
            <span class="selection-language-caret" aria-hidden="true"></span>
          </div>
        </div>
        <span id="status" role="status"></span>
      </header>

      <section id="mainView" class="view">
        <section class="settings-card">
          <button id="toggleSettings" class="settings-toggle" type="button" aria-expanded="true">
            <span class="with-icon"><span class="ui-icon icon-gear" aria-hidden="true">⚙</span><span>AI 配置</span></span>
            <span id="settingsSummary">未配置</span>
          </button>

          <div id="settingsBody" class="panel">
            <label>
              Base URL
              <input id="baseUrl" type="url" placeholder="https://api.deepseek.com" />
            </label>

            <label>
              API Key
              <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
            </label>
            <p class="security-note">API Key 仅保存在本机浏览器扩展存储中，不会通过 Chrome 同步；小译只会在你发起翻译或测试连接时使用。</p>

            <label>
              模型名称
              <input id="model" type="text" placeholder="deepseek-v4-flash" />
            </label>

            <button id="save" type="button"><span class="with-icon"><span class="ui-icon icon-check" aria-hidden="true">✓</span><span>保存设置</span></span></button>
          </div>
        </section>

        <section class="self-translate-card">
          <button id="toggleSelfTranslate" class="self-toggle" type="button" aria-expanded="true">
            <span class="with-icon"><span class="ui-icon icon-spark" aria-hidden="true">✦</span><span>自助译</span></span>
            <span id="selfSummary">自动识别 → 中文</span>
          </button>

          <div id="selfTranslateBody" class="self-body">
            <div class="translate-controls">
              <select id="sourceLanguage" aria-label="原语言"></select>
              <button id="swapLanguages" class="swap-button" type="button" title="反转翻译" aria-label="反转翻译">
                <span class="swap-icon" aria-hidden="true">
                  <span class="swap-icon-line swap-icon-top"></span>
                  <span class="swap-icon-line swap-icon-bottom"></span>
                </span>
              </button>
              <select id="targetLanguage" aria-label="目标语言"></select>
              <button id="selfTranslate" class="primary-button" type="button">翻译</button>
            </div>

            <textarea id="selfSourceText" class="translate-box source-box" rows="4" placeholder="输入要翻译的内容"></textarea>
            <div class="result-wrap">
              <div id="selfResultText" class="translate-box result-box learning-result" role="textbox" aria-readonly="true" data-placeholder="翻译结果"></div>
              <button id="copySelfResult" class="copy-result-button" type="button" data-tip="复制" aria-label="复制"><span class="copy-icon" aria-hidden="true"></span></button>
            </div>
          </div>
        </section>

        <section class="quick-actions">
          <div class="page-actions">
            <button id="translatePage" class="secondary-button core-action" type="button"><span class="with-icon"><span class="ui-icon icon-page" aria-hidden="true">☰</span><span>整页翻译</span></span></button>
            <div id="pageDisplayControl" class="page-display-control">
              <button id="pageDisplayTrigger" class="page-display-trigger" type="button" data-tip="切换译文显示格式" title="切换译文显示格式" aria-label="切换译文显示格式" aria-expanded="false"><span class="ui-icon icon-gear" aria-hidden="true">设置</span></button>
              <div id="pageDisplayMenu" class="page-display-menu" hidden>
                <button type="button" data-page-display="translated">仅译文</button>
                <button type="button" data-page-display="bilingual">双语显示</button>
              </div>
            </div>
          </div>
          <button id="showWordBook" class="quiet-button" type="button"><span class="with-icon"><span class="ui-icon icon-book" aria-hidden="true">▤</span><span>单词本</span></span></button>
          <button id="showHistory" class="quiet-button" type="button"><span class="with-icon"><span class="ui-icon icon-history" aria-hidden="true">◷</span><span>历史记录</span></span></button>
          <button id="showUsage" class="quiet-button" type="button"><span class="with-icon"><span class="ui-icon icon-token" aria-hidden="true">▥</span><span>Token 用量</span></span></button>
        </section>

        <p class="selection-hint"><span class="ui-icon icon-tip" aria-hidden="true">💡</span><span>选中文字后点击旁边的小译图标，即可使用“随手划”。</span></p>
      </section>

      <section id="historyView" class="view page-view" hidden>
        <div class="page-head">
          <button class="back-button" type="button" data-back aria-label="返回"><span class="ui-icon icon-back" aria-hidden="true">‹</span></button>
          <h2><span class="with-icon"><span class="ui-icon icon-history" aria-hidden="true">◷</span><span>翻译历史</span></span></h2>
        </div>
        <div class="page-toolbar">
          <select id="historyFilter" aria-label="历史类型">
            <option value="all">全部类型</option>
            <option value="selection">随手划</option>
            <option value="page">整页翻译</option>
            <option value="self">自助译</option>
          </select>
          <input id="historySearch" class="history-search" type="search" placeholder="搜索历史" autocomplete="off" />
          <button id="clearHistory" class="danger-button page-action" type="button"><span class="with-icon"><span class="ui-icon icon-close" aria-hidden="true">×</span><span>清空历史</span></span></button>
        </div>
        <div id="historyContent" class="page-content"></div>
      </section>

      <section id="usageView" class="view page-view" hidden>
        <div class="page-head">
          <button class="back-button" type="button" data-back aria-label="返回"><span class="ui-icon icon-back" aria-hidden="true">‹</span></button>
          <h2><span class="with-icon"><span class="ui-icon icon-token" aria-hidden="true">▥</span><span>Token 用量</span></span></h2>
          <button id="clearUsage" class="danger-button page-action" type="button"><span class="with-icon"><span class="ui-icon icon-close" aria-hidden="true">×</span><span>清空统计</span></span></button>
        </div>
        <div id="usageContent" class="page-content"></div>
      </section>

      <section id="wordBookView" class="view page-view" hidden>
        <div class="page-head">
          <button class="back-button" type="button" data-back aria-label="返回"><span class="ui-icon icon-back" aria-hidden="true">‹</span></button>
          <h2><span class="with-icon"><span class="ui-icon icon-book" aria-hidden="true">▤</span><span>单词本</span></span></h2>
          <button id="clearWordBook" class="danger-button page-action" type="button"><span class="with-icon"><span class="ui-icon icon-close" aria-hidden="true">×</span><span>清空单词本</span></span></button>
        </div>
        <div class="page-toolbar word-book-toolbar">
          <input id="wordBookSearch" class="history-search" type="search" placeholder="搜索单词或释义" autocomplete="off" />
          <div id="wordBookSortControl" class="word-book-sort-control">
            <button id="wordBookSortTrigger" class="word-book-sort-trigger" type="button" data-tip="排序：收藏时间（新到旧）" title="排序：收藏时间（新到旧）" aria-label="单词排序" aria-expanded="false"><span class="word-book-filter-icon" aria-hidden="true"></span></button>
            <div id="wordBookSortMenu" class="word-book-sort-menu" hidden>
              <button type="button" data-sort-kind="saved" data-tip="按收藏时间"><span class="word-book-clock-icon" aria-hidden="true"></span><span class="word-book-sort-direction" aria-hidden="true"></span></button>
              <button type="button" data-sort-kind="alpha" data-tip="按英文首字母"><span class="word-book-alpha-icon" aria-hidden="true">A-z</span><span class="word-book-sort-direction" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
        <div id="wordBookContent" class="page-content"></div>
      </section>
    </main>

    <div id="wordStudyDialog" class="word-study-dialog" hidden></div>

    <script src="languages.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
